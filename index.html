<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#F9F8F4" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Wash Garden" />
  <title>Wash Garden</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,600;1,700&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#F9F8F4;--fg:#2D3A31;--sage:#8C9A84;--clay:#DCCFC2;--stone:#E6E2DA;--terracotta:#C27B66;--card:#fff;--soft:#F2F0EB;--shadow:0 20px 40px -18px rgba(45,58,49,.18);}
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent} html{min-height:100%;background:var(--bg)}
    body{margin:0;min-height:100%;font-family:"Source Sans 3",system-ui,sans-serif;color:var(--fg);background:radial-gradient(circle at 18% 0%,#fff 0 20%,transparent 42%),linear-gradient(180deg,var(--bg),#F4F0E9);padding:calc(env(safe-area-inset-top) + 18px) 16px calc(env(safe-area-inset-bottom) + 22px)}
    body:after{content:"";pointer-events:none;position:fixed;inset:0;z-index:99;opacity:.018;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 400 400' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E")}
    .app{max-width:430px;margin:0 auto}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}.brand{display:flex;gap:12px;align-items:center}.mark{width:46px;height:58px;border-radius:28px 28px 18px 18px;background:linear-gradient(160deg,var(--sage),#b6bea8);box-shadow:var(--shadow);position:relative}.mark:before{content:"";position:absolute;inset:14px 18px;border-left:1.5px solid #fff8;border-radius:50%;transform:rotate(24deg)}
    h1{font-family:"Playfair Display",serif;font-size:31px;line-height:.95;margin:0;letter-spacing:-.03em}.sub{margin:4px 0 0;color:#667060;font-size:13px;letter-spacing:.08em;text-transform:uppercase}.ghost{border:1px solid var(--stone);background:#fff8;color:var(--fg);border-radius:999px;height:42px;padding:0 14px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;font-size:12px}
    .panel{background:#ffffffb8;border:1px solid var(--stone);border-radius:32px;box-shadow:var(--shadow);backdrop-filter:blur(8px);padding:18px;margin-bottom:16px}.hero{padding:22px}.hero h2{font-family:"Playfair Display",serif;font-size:42px;line-height:.92;margin:0 0 12px;letter-spacing:-.045em}.hero em{font-style:italic;color:var(--terracotta)}.note{font-size:16px;line-height:1.45;color:#5a665b;margin:0}
    .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{border-radius:24px;padding:14px 10px;background:var(--soft);min-height:86px}.stat strong{display:block;font-family:"Playfair Display",serif;font-size:30px;line-height:1}.stat span{display:block;margin-top:7px;font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:#6b7469}.stat.red{background:linear-gradient(145deg,#f6ebe6,#fff)}.stat.green{background:linear-gradient(145deg,#ecf0e8,#fff)}
    form{display:grid;gap:12px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field.full{grid-column:1/-1}label{display:block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.14em;color:#687163;margin:0 0 6px 4px}input{width:100%;height:52px;border:1px solid var(--stone);border-radius:999px;background:#F7F5F0;color:var(--fg);font:600 17px "Source Sans 3";padding:0 17px;outline:none}input:focus{border-color:var(--sage);box-shadow:0 0 0 3px #8c9a8428}.primary{height:54px;border:0;border-radius:999px;background:var(--fg);color:#fff;font-weight:800;letter-spacing:.14em;text-transform:uppercase;box-shadow:0 14px 24px -15px rgba(45,58,49,.65)}
    .toolbar{display:flex;align-items:center;justify-content:space-between;margin:20px 3px 10px}.toolbar h3{font-family:"Playfair Display",serif;font-size:25px;margin:0}.list{display:grid;gap:12px}.card{position:relative;border:1px solid var(--stone);border-radius:30px;background:#fff;box-shadow:0 10px 22px -18px rgba(45,58,49,.35);padding:16px;display:grid;grid-template-columns:auto 1fr auto;gap:13px;align-items:center;transition:.35s ease}.card.selected{outline:3px solid #8c9a8433}.badge{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;font-weight:900;letter-spacing:.06em}.badge.red{background:#f5e0d8;color:#9f563e}.badge.green{background:#e8eee2;color:#64765c}.sym{font-family:"Playfair Display",serif;font-size:28px;font-weight:700;line-height:1}.meta{font-size:13px;color:#687163;line-height:1.35}.price{font-weight:800;color:var(--fg)}.pill{border-radius:999px;padding:7px 10px;font-size:11px;text-transform:uppercase;letter-spacing:.11em;font-weight:900;white-space:nowrap}.pill.red{background:#f5e0d8;color:#9f563e}.pill.green{background:#e8eee2;color:#64765c}.check{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--sage);display:none;place-items:center}.selecting .check{display:grid}.selected .check:after{content:"";width:10px;height:10px;border-radius:50%;background:var(--sage)}.empty{text-align:center;padding:26px;color:#697366}.empty strong{display:block;font-family:"Playfair Display",serif;font-size:26px;color:var(--fg);margin-bottom:5px}
    .bulk{position:fixed;left:16px;right:16px;bottom:calc(env(safe-area-inset-bottom) + 14px);max-width:430px;margin:auto;background:#2D3A31;color:#fff;border-radius:999px;padding:10px 10px 10px 18px;display:none;align-items:center;justify-content:space-between;box-shadow:0 25px 50px -20px rgba(45,58,49,.5);z-index:60}.bulk.show{display:flex}.danger{border:0;border-radius:999px;background:var(--terracotta);color:#fff;height:42px;padding:0 16px;font-weight:900;text-transform:uppercase;letter-spacing:.12em}.foot{text-align:center;color:#7b8378;font-size:12px;line-height:1.35;margin:16px 10px 0}.sr{position:absolute;left:-9999px}@media (max-width:360px){.hero h2{font-size:37px}.fields{grid-template-columns:1fr}.stat strong{font-size:25px}.sym{font-size:24px}.card{gap:10px;padding:14px}.badge{width:48px;height:48px}}
  </style>
</head>
<body>
  <main class="app">
    <header class="top"><div class="brand"><div class="mark"></div><div><h1>Wash<br>Garden</h1><p class="sub">31-day tracker</p></div></div><button id="selectBtn" class="ghost">Select</button></header>
    <section class="panel hero"><h2>Track sales until they <em>clear.</em></h2><p class="note">Entries remain terracotta through day 31 after sale, then turn sage on day 32.</p></section>
    <section class="stats" aria-label="Summary"><div class="stat green"><strong id="clearedCount">0</strong><span>Cleared</span></div><div class="stat red"><strong id="activeCount">0</strong><span>In wash</span></div><div class="stat"><strong id="shareCount">0</strong><span>Shares</span></div></section>
    <section class="panel" style="margin-top:16px"><form id="entryForm"><div class="fields"><div class="field full"><label for="symbol">Stock symbol</label><input id="symbol" autocomplete="off" autocapitalize="characters" placeholder="AAPL" required /></div><div class="field"><label for="dateSold">Date sold</label><input id="dateSold" type="date" required /></div><div class="field"><label for="quantity">Quantity</label><input id="quantity" type="number" inputmode="decimal" min="0" step="any" placeholder="10" required /></div><div class="field full"><label for="priceSold">Price sold</label><input id="priceSold" type="number" inputmode="decimal" min="0" step="0.01" placeholder="185.25" required /></div></div><button class="primary" type="submit">Add Sale</button></form></section>
    <div class="toolbar"><h3>Entries</h3><button id="clearBtn" class="ghost" type="button">Clear All</button></div>
    <section id="list" class="list" aria-live="polite"></section>
    <p class="foot">Stored locally on this iPhone/browser. This is an organizer, not tax advice.</p>
  </main>
  <div id="bulk" class="bulk"><span id="bulkText">0 selected</span><button id="deleteSelected" class="danger">Delete</button></div>
<script>
(() => {
  const KEY='wash-garden.entries.v2';
  const $=id=>document.getElementById(id);
  const form=$('entryForm'), list=$('list'), selectBtn=$('selectBtn'), bulk=$('bulk');
  const todayISO=()=>new Date().toISOString().slice(0,10);
  let entries=JSON.parse(localStorage.getItem(KEY)||'[]'), selecting=false, selected=new Set();
  $('dateSold').value=todayISO();
  const save=()=>localStorage.setItem(KEY,JSON.stringify(entries));
  const money=n=>Number(n||0).toLocaleString(undefined,{style:'currency',currency:'USD'});
  const daysSince=iso=>{const a=new Date(iso+'T00:00:00'),b=new Date(todayISO()+'T00:00:00');return Math.max(0,Math.floor((b-a)/86400000));};
  const state=e=>{const d=daysSince(e.dateSold);return {days:d,cleared:d>=32,remaining:Math.max(0,32-d)};};
  const sorted=()=>[...entries].sort((a,b)=>{const sa=state(a),sb=state(b); if(sa.cleared!==sb.cleared) return sa.cleared?-1:1; return sb.days-sa.days;});
  function render(){
    const active=entries.filter(e=>!state(e).cleared), cleared=entries.length-active.length;
    $('clearedCount').textContent=cleared; $('activeCount').textContent=active.length; $('shareCount').textContent=entries.reduce((s,e)=>s+Number(e.quantity||0),0).toLocaleString();
    document.body.classList.toggle('selecting',selecting); selectBtn.textContent=selecting?'Done':'Select';
    bulk.classList.toggle('show',selecting&&selected.size>0); $('bulkText').textContent=`${selected.size} selected`;
    if(!entries.length){list.innerHTML='<div class="panel empty"><strong>No sales yet.</strong>Add a sale above to begin the 31-day watch.</div>';return;}
    list.innerHTML=sorted().map(e=>{const s=state(e), red=!s.cleared, basis=Number(e.quantity||0)*Number(e.priceSold||0); return `<article class="card ${selected.has(e.id)?'selected':''}" data-id="${e.id}"><div class="check" aria-hidden="true"></div><div class="badge ${red?'red':'green'}">${e.symbol.slice(0,2)}</div><div><div class="sym">${e.symbol}</div><div class="meta">${Number(e.quantity).toLocaleString()} shares · Sold ${fmtDate(e.dateSold)}<br><span class="price">${money(e.priceSold)}</span> each · ${money(basis)} total</div></div><div class="pill ${red?'red':'green'}">${red?s.remaining+' days':'Clear'}</div></article>`}).join('');
  }
  function fmtDate(iso){return new Date(iso+'T00:00:00').toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'});}
  form.addEventListener('submit',e=>{e.preventDefault(); const symbol=$('symbol').value.trim().toUpperCase(); const quantity=parseFloat($('quantity').value); const priceSold=parseFloat($('priceSold').value); const dateSold=$('dateSold').value; if(!symbol||!dateSold||!quantity||!priceSold) return; entries.push({id:crypto.randomUUID?crypto.randomUUID():String(Date.now()),symbol,quantity,priceSold,dateSold,createdAt:new Date().toISOString()}); save(); form.reset(); $('dateSold').value=todayISO(); $('symbol').focus(); render();});
  selectBtn.onclick=()=>{selecting=!selecting; if(!selecting) selected.clear(); render();};
  list.onclick=e=>{const card=e.target.closest('.card'); if(!card) return; const id=card.dataset.id; if(selecting){selected.has(id)?selected.delete(id):selected.add(id); render();}};
  $('deleteSelected').onclick=()=>{if(!selected.size) return; if(confirm(`Delete ${selected.size} selected entr${selected.size===1?'y':'ies'}?`)){entries=entries.filter(e=>!selected.has(e.id)); selected.clear(); selecting=false; save(); render();}};
  $('clearBtn').onclick=()=>{if(entries.length&&confirm('Delete all entries?')){entries=[];selected.clear();selecting=false;save();render();}};
  const manifest={name:'Wash Garden',short_name:'Wash Garden',start_url:'.',display:'standalone',background_color:'#F9F8F4',theme_color:'#F9F8F4',icons:[{src:'data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 512 512%22%3E%3Crect width=%22512%22 height=%22512%22 rx=%22122%22 fill=%22%23F9F8F4%22/%3E%3Cpath d=%22M256 88c80 0 132 60 132 148v156H124V236c0-88 52-148 132-148Z%22 fill=%22%238C9A84%22/%3E%3Cpath d=%22M256 154c-22 58-18 116 0 184 24-65 25-123 0-184Z%22 fill=%22%23F9F8F4%22 opacity=%22.75%22/%3E%3C/svg%3E',sizes:'512x512',type:'image/svg+xml'}]};
  const link=document.createElement('link'); link.rel='manifest'; link.href='data:application/manifest+json,'+encodeURIComponent(JSON.stringify(manifest)); document.head.appendChild(link);
  render();
})();
</script>
</body>
</html>
